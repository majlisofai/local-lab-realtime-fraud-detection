name: fraud-lab

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.app
  image: fraud-lab-app:latest
  volumes:
    - ./:/workspace            # live code + shared data (parquet, Feast registry, reports)
  environment: &app-env
    MLFLOW_TRACKING_URI: http://mlflow:5000
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REDIS_HOST: redis
    FRAUD_API_URL: http://api:8000
    UV_NO_SYNC: "1"            # deps are baked into the image by `make build`

services:
  # ───────────────────────── Streaming ─────────────────────────
  kafka:
    image: apache/kafka:3.9.1            # KRaft mode, no ZooKeeper
    ports: ["9094:9094"]                 # for clients on your laptop
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:                            # one-shot: create topics (3 partitions = up to 3 parallel consumers)
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in airport.transactions airport.predictions airport.fraud-alerts; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: airport-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: {condition: service_healthy}

  # ───────────────────────── Feature store ─────────────────────────
  redis:                                 # Feast online store
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ───────────────────────── Model management ─────────────────────────
  postgres:                              # MLflow backend store (runs, metrics, registry)
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: fraud-lab-mlflow:latest
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}",
              "--artifacts-destination", "/mlartifacts", "--serve-artifacts"]
    ports: ["5001:5000"]                 # 5000 is taken by AirPlay on macOS
    volumes: [mlflow_artifacts:/mlartifacts]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 12

  # ───────────────────────── ML jobs (run on demand) ─────────────────────────
  trainer:
    <<: *app
    profiles: [jobs]
    depends_on:
      redis: {condition: service_healthy}
      mlflow: {condition: service_healthy}

  # ───────────────────────── Serving & streaming apps ─────────────────────────
  api:
    <<: *app
    command: ["uv", "run", "uvicorn", "fraud.serving.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      retries: 30
    profiles: [serve]

  producer:
    <<: *app
    command: ["uv", "run", "python", "-m", "fraud.streaming.producer"]
    environment:
      <<: *app-env
      TRANSACTIONS_PER_SECOND: "${TRANSACTIONS_PER_SECOND:-5}"
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    profiles: [stream]

  consumer:
    <<: *app
    command: ["uv", "run", "python", "-m", "fraud.streaming.consumer"]
    environment:
      <<: *app-env
      DRIFT_WINDOW: "200"
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    profiles: [stream]

  # ───────────────────────── Monitoring ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--web.enable-lifecycle"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/airport-fraud.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

  kafka-exporter:                        # consumer lag, offsets per topic/partition
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]

  cadvisor:                              # per-container CPU / memory
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports: ["8081:8080"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command: ["--docker_only=true", "--housekeeping_interval=10s"]

  # ───────────────────────── Step 9: automation ─────────────────────────
  prefect-server:                        # orchestration API + UI: run every stage from the browser
    <<: *app
    command: ["uv", "run", "prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports: ["4200:4200"]
    environment:
      UV_NO_SYNC: "1"
      PREFECT_HOME: /prefect
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes: [prefect_data:/prefect]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4200/api/health"]
      interval: 10s
      retries: 30
    profiles: [automate]

  prefect-flows:                         # serves the stage flows as deployments and executes their runs
    <<: *app
    command: ["uv", "run", "python", "-m", "fraud.orchestration.flows"]
    environment:
      <<: *app-env
      PREFECT_API_URL: http://prefect-server:4200/api
      PROMETHEUS_URL: http://prometheus:9090
      LAB_HOST_DIR: ${LAB_HOST_DIR:-/lab-host-dir-not-set}
    volumes:
      - ./:/workspace
      - ./:${LAB_HOST_DIR:-/lab-host-dir-not-set}    # same path as on the laptop -> compose bind mounts resolve
      - /var/run/docker.sock:/var/run/docker.sock    # start/stop the api, producer, consumer containers
    depends_on:
      prefect-server: {condition: service_healthy}
      redis: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    restart: unless-stopped
    profiles: [automate]

  lab-console:                           # live architecture view + run buttons + Alertmanager webhook
    <<: *app
    command: ["uv", "run", "uvicorn", "fraud.console.app:app", "--host", "0.0.0.0", "--port", "8090"]
    ports: ["8090:8090"]
    environment:
      <<: *app-env
      PREFECT_API_URL: http://prefect-server:4200/api
      PROMETHEUS_URL: http://prometheus:9090
      AUTO_RETRAIN_ON_DRIFT: "true"
      RETRAIN_COOLDOWN_MINUTES: "3"
    depends_on:
      prefect-server: {condition: service_healthy}
    profiles: [automate]

  alertmanager:                          # routes Prometheus alerts; DataDriftDetected -> retrain webhook
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes: [./monitoring/alertmanager:/etc/alertmanager:ro]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    profiles: [automate]

volumes:
  kafka_data:
  redis_data:
  postgres_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  prefect_data:
