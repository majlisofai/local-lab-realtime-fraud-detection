global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ── ML application metrics ──
  - job_name: fraud-api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: fraud-consumer          # DNS discovery: finds every replica after `make scale`
    dns_sd_configs:
      - names: ["consumer"]
        type: A
        port: 8001
  - job_name: simulator
    static_configs: [{targets: ["producer:8002"]}]

  # ── Infrastructure metrics ──
  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
