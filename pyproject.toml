[project]
name = "airport-fraud-lab"
version = "0.1.0"
description = "Local lab: real-time fraud detection for airport payments (Kafka, Feast, DVC, MLflow, FastAPI, Prometheus, Grafana, Evidently)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka==2.6.1",
    "dvc==3.59.1",
    "evidently==0.6.7",
    "fastapi==0.115.12",     # prefect 3.4 server needs Body(min_items=...)
    "feast[redis]==0.49.0",
    "mlflow==2.22.0",
    "numpy<2",
    "pandas==2.2.3",
    "pathspec<0.13",        # dvc 3.59 breaks on pathspec 1.x
    "prefect>=3.4,<3.5",
    "prometheus-client==0.21.1",
    "prometheus-fastapi-instrumentator==7.0.0",
    "pyarrow",
    "pyyaml",
    "requests",
    "scikit-learn==1.5.2",
    "sqlalchemy<2.1",       # mlflow 2.22 breaks on SQLAlchemy 2.1
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]
